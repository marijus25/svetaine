<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patikrink skelbimą — Tikra vertė</title>
  <meta name="description" content="Įklijuok skelbimo tekstą ir per sekundę sužinok, ar prašoma kaina atitinka realią vertę. Nuotraukų nereikia.">
  <meta name="author" content="Marijus Tamulynas">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-puslapis="skelbimas">

  <div id="virsus"></div>
  <main id="turinys">
  <div class="puslapio-antraste">
    <div class="wrap">
      <h1>Patikrink skelbimą</h1>
      <p class="lead">Įklijuok skelbimo tekstą — atsakymą gausi iškart. Nuotraukų nereikia.</p>
    </div>
  </div>

  <section class="wrap" style="max-width:900px;padding-bottom:72px;">

    <div class="kortele stulpelis tarpas-18" style="padding:30px;">
      <div class="laukas">
        <label class="etikete" for="gTekstas">Skelbimo tekstas</label>
        <textarea id="gTekstas" style="height:170px;"
                  placeholder="Pažymėk visą skelbimą su duomenų lentele, nukopijuok ir įklijuok čia. Įklijavus patikra prasideda pati."></textarea>
      </div>

      <div class="laukas">
        <label class="etikete" for="gKaina">Prašoma kaina</label>
        <div class="su-valiuta" style="max-width:260px;">
          <input type="number" id="gKaina" min="0" step="1" inputmode="numeric" placeholder="paimsime iš skelbimo">
          <span class="valiuta">&euro;</span>
        </div>
      </div>

      <div class="laukas" id="gNuorodosEile" hidden>
        <label class="etikete" for="gNuoroda">Nuoroda į skelbimą</label>
        <input type="url" id="gNuoroda" placeholder="https://...">
      </div>

      <div class="mygtukas-ir-busena">
        <button type="button" class="mygtukas m-pagrindinis" id="gMygtukas">Patikrinti</button>
        <span class="smulkus" id="gBusena" role="status"></span>
      </div>
    </div>

    <div id="skelbimoRezultatas" style="margin-top:34px;"></div>
    <div id="palyginimas" style="margin-top:34px;"></div>

  </section>

  </main>

  <div id="apacia"></div>

  <script src="nustatymai.js"></script>
  <script src="saugiklis.js"></script>
  <script src="katalogas.js"></script>
  <script src="svetaine.js"></script>
  <script src="zingsniai.js"></script>
</body>
</html>
