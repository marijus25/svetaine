<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontaktai — Tikra vertė</title>
  <meta name="description" content="Susisiek dėl vertinimo, pažymų, reklamos arba prieigos įmonėms.">
  <meta name="author" content="Marijus Tamulynas">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-puslapis="kontaktai">

  <div id="virsus"></div>
  <main id="turinys">
  <div class="puslapio-antraste">
    <div class="wrap">
      <h1>Kontaktai</h1>
    </div>
  </div>

  <section class="wrap turinys-ir-sonas" style="padding-bottom:72px;">

    <!-- Forma rodoma tik tada, kai svetaine.js įrašytas SVETAINE.pastas.
         Siunčiama per el. pašto programą (mailto:), serverio nereikia. -->
    <form class="kortele stulpelis tarpas-22" style="padding:30px;" id="kontaktuForma" hidden>
      <div class="stulpelis tarpas-8">
        <span class="etikete">Tema</span>
        <div class="temos" role="group" aria-label="Tema"><button type="button" class="tema" data-tema="klausimas" aria-pressed="false">Klausimas</button><button type="button" class="tema" data-tema="klaida" aria-pressed="false">Klaida vertinime</button><button type="button" class="tema" data-tema="reklama" aria-pressed="false">Reklama</button><button type="button" class="tema" data-tema="imonems" aria-pressed="false">Įmonėms</button><button type="button" class="tema" data-tema="kita" aria-pressed="false">Kita</button></div>
      </div>

      <div class="laukas">
        <label class="etikete" for="zinute">Žinutė</label>
        <textarea id="zinute" name="zinute" placeholder="Trumpai aprašyk, ko reikia"></textarea>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;">
        <span class="smulkus">Atsakau per porą dienų.</span>
        <button type="submit" class="mygtukas m-pagrindinis">Siųsti el. paštu</button>
      </div>
    </form>

    <div class="stulpelis tarpas-18">
      <div class="kortele stulpelis" style="padding:12px 26px;">
          <div id="pastoEilute" style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--linija-2);" hidden>
            <span class="smulkus">El. paštas</span>
            <span data-pastas style="font-size:14.5px;font-weight:500;overflow-wrap:anywhere;"></span>
          </div>
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 0;">
            <span class="smulkus">Adresas</span>
            <span style="font-size:14.5px;font-weight:500;">Alytus, Lietuva</span>
          </div>
      </div>
    </div>

  </section>
  </main>

  <div id="apacia"></div>

  <script src="nustatymai.js"></script>
  <script src="saugiklis.js"></script>
  <script src="katalogas.js"></script>
  <script src="svetaine.js"></script>
</body>
</html>
